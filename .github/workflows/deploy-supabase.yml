name: Deploy Supabase (Migrations & Edge Functions)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase Project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push Database Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push --remote --yes --include-all --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy dispatch-reminder --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase functions deploy dispatch-nudge --no-verify-jwt --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Sync Edge Function Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          # Only sync secrets if they are defined in GitHub Secrets
          SECRETS_ARGS=()
          [ -n "$RESEND_API_KEY" ] && SECRETS_ARGS+=("RESEND_API_KEY=$RESEND_API_KEY")
          [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && SECRETS_ARGS+=("FIREBASE_SERVICE_ACCOUNT=$FIREBASE_SERVICE_ACCOUNT")
          [ -n "$ENCRYPTION_KEY" ] && SECRETS_ARGS+=("ENCRYPTION_KEY=$ENCRYPTION_KEY")
          
          if [ ${#SECRETS_ARGS[@]} -gt 0 ]; then
            echo "Setting Supabase Edge Function secrets..."
            supabase secrets set "${SECRETS_ARGS[@]}" --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          else
            echo "No optional backend secrets provided; skipping secret injection."
          fi
